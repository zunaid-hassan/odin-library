<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="reset.css" rel="stylesheet" />
    <link href="styles.css" rel="stylesheet" />
    <title>Library App - The Odin Project</title>
  </head>
  <body>
    <script src="script.js" defer></script>
    <header>
      <div class="title">
        <h1 class="hover-letters">Library App</h1>
        <span id="book-icon">🕮</span>
        <!-- <p>Work-in-progress</p> -->
      </div>

      <div class="btn-container">
        <button
          class="add-new-book-btn"
          command="show-modal"
          commandfor="add-new-book-modal"
        >
          Add new book
        </button>
      </div>
    </header>
    <dialog id="add-new-book-modal" open>
      <p class="add-new-book-text">Add a new book:</p>
      <form method="dialog">
        <div class="add-new-book grid">
          <label for="book-name-value">Book:</label>
          <input
            type="text"
            id="book-name-value"
            placeholder="e.g. Fantasy World"
          />

          <label for="author-value">Author:</label>
          <input type="text" id="author-value" placeholder="e.g. John Bob" />

          <label for="pages-value">Pages:</label>
          <input
            type="number"
            id="pages-value"
            placeholder="e.g. 302"
            min="1"
          />

          <label for="status-value">Status:</label>
          <div id="status-value">
            <input type="radio" value="read" id="read" name="status" />
            <label for="read">Read</label>

            <input
              type="radio"
              value="unread"
              id="unread"
              name="status"
              checked
            />
            <label for="unread">Unread</label>
          </div>
        </div>
      </form>
      <button
        commandfor="add-new-book-modal"
        command="close"
        class="close-add-new-book-btn"
      >
        Close
      </button>
    </dialog>

    <main class="wrapper grid">
      <div class="books-container grid">

          <div class="read-status">read</div>
        </div> -->

  </body>
</html>
